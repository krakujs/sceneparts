name: ci
# Runs on pull requests from forks without secrets or write access, so contributed code can't reach anything.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Remember the PR number for the labelling workflow
        if: github.event_name == 'pull_request'
        run: mkdir -p pr-previews && echo "${{ github.event.number }}" > pr-previews/pr-number.txt
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm run typecheck
      - name: Check parts
        run: node packages/cli/src/cli.mjs check --all --json check-report.json
      - name: Demo story
        run: node packages/cli/src/cli.mjs validate examples/anubis-demo/story.json && node packages/cli/src/cli.mjs preview examples/anubis-demo/story.json --out .sceneparts/demo-preview.png
      - name: Previews of changed parts
        if: always() && github.event_name == 'pull_request'
        run: |
          base=origin/${{ github.base_ref }}
          ids=$(git diff --name-only "$base"...${{ github.event.pull_request.head.sha }} -- parts | awk -F/ 'NF>=4{print $2"/"$3}' | sort -u)
          for id in $ids; do [ -f "parts/$id/part.json" ] && node packages/cli/src/cli.mjs check "$id" --out pr-previews || true; done
          echo "$ids" > pr-previews/changed.txt
          [ -f check-report.json ] && cp check-report.json pr-previews/ || echo '{}' > pr-previews/check-report.json
      - name: Sign-off (DCO)
        if: always() && github.event_name == 'pull_request'
        run: |
          missing=$(git log --no-merges --format='%H %(trailers:key=Signed-off-by,valueonly)' origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }} | awk 'NF==1{print $1}')
          if [ -n "$missing" ]; then echo "Commits without 'Signed-off-by' (use git commit -s, or git rebase --signoff): $missing"; echo dco > pr-previews/dco-missing.txt; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with: { name: pr-previews, path: pr-previews }
